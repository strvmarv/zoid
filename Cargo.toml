[workspace]
members = ["crates/zoid-core", "crates/zoid-model", "crates/zoid-plugin", "crates/zoid-provider", "crates/zoid-tui", "crates/zoid-tools", "crates/zoid-syntax", "crates/zoid", "crates/zoid-testkit", "crates/zoid-companion", "crates/zoid-mcp", "crates/zoid-embed", "crates/zoid-web", "crates/zoid-plugin-import"]
exclude = ["spikes"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.6.0"
repository = "https://github.com/strvmarv/zoid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures-util = "0.3"
ratatui-textarea = "0.9"
proptest = "1"
insta = "1"
tempfile = "3"
# default-features disabled: zoid uses git2 only for LOCAL repo introspection
# (open/status/worktrees), never network git. The default `https`/`ssh`
# transports drag in openssl-sys + libssh2-sys, which fail to cross-compile for
# the static-musl release target. Dropping them keeps the musl build clean.
git2 = { version = "0.20", default-features = false }
toml = "0.8"
tiny_http = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json", "registry"] }
regex = "1"
globset = "0.4"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# candle's matmul kernels need real optimization even under the release
# profile's opt-level = "z" (size-optimized); this override keeps the
# embedding leaf crate fast without changing the rest of the release build.
[profile.release.package.zoid-embed]
opt-level = 3

# The hot compaction code in zoid-core (estimate_tokens, output.lines,
# compaction walking) runs 2.5x faster under opt-level=1. Surgical
# override mirroring the release profile's zoid-embed pattern — only
# the leaf crate pays the compile cost, every dependent test binary
# gets the optimized code.
[profile.test.package.zoid-core]
opt-level = 1
