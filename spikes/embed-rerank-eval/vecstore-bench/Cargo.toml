[package]
name = "vecstore-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Synthetic bench: validate the EmbeddingIndex resume-load + brute-force scan
# over a real on-disk sqlite event_embeddings table. No ML models — random unit
# vectors. Answers: (a) how long to load the recent-M ring on resume, (b) how
# long a top-K cosine scan takes, at realistic sizes.
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
