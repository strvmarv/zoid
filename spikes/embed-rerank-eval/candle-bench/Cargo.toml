[package]
name = "candle-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Phase-1 correctness + latency spike for the pure-Rust (candle) path.
# bge-small embedding (CLS pool + L2) + bge-reranker-base cross-encoder.
[dependencies]
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
# ureq default-features pull rustls (ring) -> NO OpenSSL. Avoid native-tls.
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
anyhow = "1"
serde_json = "1"

# Representative CPU perf: build release (debug candle CPU is misleadingly slow).
[profile.release]
opt-level = 3
