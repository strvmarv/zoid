[package]
name = "rust-spike"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-spike"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
# R2 native-interop
wasmtime = "27"
wat = "1"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
