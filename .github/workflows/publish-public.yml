name: publish-public

# Invoked by cargo-dist's publish stage (dist-workspace.toml: publish-jobs =
# ["./publish-public"]). cargo-dist calls this as a reusable workflow (a
# `custom-publish-public` job in the dist-generated .github/workflows/release.yml)
# after the "host" job completes, passing the JSON dist-manifest via the `plan`
# input and `secrets: inherit`.
#
# No checkout: `custom-publish-public` only gets `id-token: write` and
# `packages: write` permissions (see release.yml — "publish jobs get escalated
# permissions"), so `contents` is implicitly `none`. A checkout of the private
# source repo would fail under those permissions. Release notes therefore come
# from cargo-dist's own changelog parsing (CHANGELOG.md, verified via
# `dist plan --output-format=json` to populate `announcement_changelog` with
# the version's section text) passed through the `plan` input — no checkout
# needed.
#
# Artifact handoff: cargo-dist does NOT hand built artifacts to custom publish
# jobs through the `plan` input or any single named bundle. Every earlier job in
# the SAME workflow run (build-local-artifacts, build-global-artifacts, host)
# uploads its outputs via `actions/upload-artifact` under names prefixed
# `artifacts-*` (e.g. `artifacts-build-local-<target>`, `artifacts-build-global`,
# `artifacts-dist-manifest`). The dist-generated "host" job in this same
# release.yml fetches them with:
#   uses: actions/download-artifact@v8
#   with: { pattern: artifacts-*, path: target/distrib/, merge-multiple: true }
# This job mirrors that exact, empirically-confirmed mechanism (verified by
# inspecting this repo's own `dist generate`-d release.yml) since it runs as
# part of the same workflow run and those artifacts are still available.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-public:
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: dist-artifacts
          merge-multiple: true

      - name: Point installer scripts at the public releases repo
        # cargo-dist bakes the download base URL into the generated
        # zoid-installer.sh / zoid-installer.ps1 from dist-workspace.toml's
        # `repository = "https://github.com/strvmarv/zoid"` (the PRIVATE
        # source repo). Those installer scripts get uploaded to the PUBLIC
        # strvmarv/zoid-releases release below, so an anonymous first-install
        # (`curl <installer-url> | sh`) would 404 against the private repo.
        # Rewrite the embedded `strvmarv/zoid/releases` path (as found in the
        # generated scripts: literal `https://github.com/strvmarv/zoid/releases/...`
        # URLs and `${INSTALLER_BASE_URL}/strvmarv/zoid/releases/...` templated
        # forms for GHE/custom-host overrides) to the public releases repo.
        # Anchored on `/releases` so it can't over-match unrelated
        # `"owner":"strvmarv"` receipt-JSON metadata also embedded in the scripts.
        working-directory: dist-artifacts
        run: |
          set -euo pipefail
          for f in zoid-installer.sh zoid-installer.ps1; do
            if [ -f "$f" ]; then
              sed -i 's#strvmarv/zoid/releases#strvmarv/zoid-releases/releases#g' "$f"
              echo "rewrote $f"
            fi
          done
          # Fail loudly if the private URL still appears anywhere in the installers
          if grep -RIl 'strvmarv/zoid/releases' zoid-installer.* 2>/dev/null; then
            echo "::error::installer still references the private repo after rewrite"; exit 1
          fi

      - name: Publish release to public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Release notes: cargo-dist's FULL GitHub release body — changelog PLUS
          # the auto-generated "Install" curl/powershell one-liners and the
          # download table. (announcement_changelog is only the raw CHANGELOG
          # section and drops the install instructions.) Its embedded download
          # URLs point at the PRIVATE source repo, so they are rewritten to the
          # public repo below — same substitution applied to the installer
          # scripts. Passed via env (not interpolated into the shell script) to
          # avoid shell-injection.
          NOTES_BODY: ${{ fromJson(inputs.plan).announcement_github_body }}
        run: |
          set -euo pipefail
          # Drop dist's own bookkeeping manifests — only ship real release assets
          # (archives, sha256.sum, per-artifact .sha256, installer scripts).
          rm -f dist-artifacts/*dist-manifest.json
          # Belt-and-suspenders: dist-workspace.toml sets source-tarball = false so
          # cargo-dist never builds source.tar.gz, but make sure none slips through
          # regardless (the source repo is private and must not leak here).
          rm -f dist-artifacts/source.tar.gz*

          # Fail legibly rather than publishing an empty/broken release.
          test -n "$(ls -A dist-artifacts 2>/dev/null)" || { echo "::error::no artifacts downloaded"; exit 1; }

          if [ -n "${NOTES_BODY:-}" ]; then
            printf '%s' "$NOTES_BODY" > notes.md
            # The dist-generated body bakes PRIVATE-repo download URLs into the
            # install one-liners and the download table. Rewrite them to the
            # public releases repo so anonymous installs don't 404 (identical
            # substitution to the installer-script step above).
            sed -i 's#strvmarv/zoid/releases#strvmarv/zoid-releases/releases#g' notes.md
            if grep -q 'strvmarv/zoid/releases' notes.md; then
              echo "::error::release notes still reference the private repo after rewrite"; exit 1
            fi
          else
            printf 'zoid %s' "$TAG" > notes.md
          fi

          gh release create "$TAG" \
            --repo strvmarv/zoid-releases \
            --title "$TAG" \
            --notes-file notes.md \
            dist-artifacts/*
