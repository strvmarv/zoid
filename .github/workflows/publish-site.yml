name: publish-site

# Mirrors the marketing site in /public from this PRIVATE source repo
# (strvmarv/zoid) into the PUBLIC strvmarv/zoid-releases repo, where it is
# served via GitHub Pages from a /docs folder on the main branch.
#
# Why a separate repo: the source repo is private. GitHub Pages cannot be
# enabled on a private repo for anonymous/public viewing, so the site must
# live in the public releases repo alongside the binary assets.
#
# Why copy-as-is: /public/index.html is already self-contained — the scene
# frames captured into /public/frames/<scene>/ are inlined into it by
# public/assemble-site.sh at authoring time. There is no build step at serve
# time. The committed artifact is what we ship, so CI needs no Rust toolchain
# and no regeneration of frames — deterministic and fast.
#
# Token: uses RELEASES_REPO_TOKEN (a PAT with contents:write on
# strvmarv/zoid-releases) configured as a repo secret on the private repo.
# The default GITHUB_TOKEN is scoped to THIS repo and cannot push elsewhere.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
  workflow_dispatch:
    # Manual republish without needing a /public change. Useful after
    # toggling GitHub Pages settings or backfilling the site to an
    # already-set-up releases repo.

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Only /public matters; sparse-checkout keeps the checkout tiny.
          sparse-checkout: |
            public

      - name: Validate site is present and self-contained
        # Guard against shipping a broken or half-regenerated site. Authoring
        # runs public/capture-preview.sh then public/assemble-site.sh, which
        # inlines each scene's frames into index.html between
        # <!--FRAMES:<scene>:BEGIN/END--> markers. Fail loudly here rather than
        # publishing an empty or stale page.
        run: |
          set -euo pipefail
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }
          test -d public/frames    || { echo "::error::public/frames missing";  exit 1; }
          # Every scene must have captured frames AND be inlined into the page.
          # Checking the marker block (not just the dir) is what catches a
          # half-run assemble: frames present on disk but never inlined.
          for scene in context-economy tools-models extensibility; do
            ls public/frames/"$scene"/*.html >/dev/null 2>&1 \
              || { echo "::error::public/frames/$scene has no frames (run capture-preview.sh)"; exit 1; }
            inlined=$(awk -v b="FRAMES:$scene:BEGIN" -v e="FRAMES:$scene:END" \
              '$0 ~ b {f=1; next} $0 ~ e {f=0} f' public/index.html | grep -c 'tui-frame' || true)
            test "$inlined" -gt 0 \
              || { echo "::error::$scene not inlined into index.html (run assemble-site.sh)"; exit 1; }
          done
          # The site is deliberately version-free: the TUI status bar bakes in
          # CARGO_PKG_VERSION at capture time, which would pin the page to one
          # release and go stale at the next. capture-preview.sh strips it; this
          # catches any path that reintroduces one.
          if grep -rEo 'v[0-9]+\.[0-9]+\.[0-9]+' public/index.html public/preview.html public/frames/ 2>/dev/null | head -1 | grep -q .; then
            echo "::error::version token found in the site — see capture-preview.sh strip_version"
            grep -rEn 'v[0-9]+\.[0-9]+\.[0-9]+' public/index.html public/preview.html public/frames/ 2>/dev/null | head
            exit 1
          fi
          # README and the authoring scripts are dev-only; do NOT ship them.
          echo "site validated"

      - name: Checkout releases repo
        uses: actions/checkout@v6
        with:
          repository: strvmarv/zoid-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: releases-repo
          # persist-credentials: true (default) writes the token into the
          # local git config so the subsequent `git push` can authenticate.
          # Setting false here breaks the push step.

      - name: Sync site into releases-repo/docs
        # Mirror /public → /docs, replacing any prior site entirely. We wipe
        # docs/ first so deleted/renamed frames in the source don't linger as
        # stale files in the public repo. The root README.md (the releases
        # landing page) is left untouched — Pages serves from /docs only.
        run: |
          set -euo pipefail
          cd releases-repo
          # Keep .git and any root files; only manage docs/.
          rm -rf docs
          mkdir -p docs
          # Copy the site payload, excluding the dev-only build scripts and
          # the README that documents the private-repo build pipeline.
          cp -r ../public/. docs/
          # Dev-only: the authoring pipeline (capture + assemble), its preview
          # template, and the README documenting the private-repo workflow.
          # index.html/preview.html are the already-inlined artifacts, so
          # nothing here is needed at serve time. Deleting a file from
          # public/ MUST also be removed from this list — anything not listed
          # ships to the public site.
          rm -f docs/capture-preview.sh docs/assemble-site.sh docs/assemble-preview.sh \
                docs/preview.template.html docs/README.md
          # Fail rather than publish a dev script we forgot to strip.
          if ls docs/*.sh >/dev/null 2>&1; then
            echo "::error::dev script(s) would ship to the public site:"; ls docs/*.sh; exit 1
          fi
          echo "synced site into docs/"
          ls -la docs/ docs/frames/

      - name: Commit and push
        # No-op if nothing changed (e.g. a re-run of workflow_dispatch with no
        # site changes). Avoids empty commits and spurious Pages rebuilds.
        run: |
          set -euo pipefail
          cd releases-repo
          git config user.name  "zoid-ci[bot]"
          git config user.email "actions@github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "no site changes to publish"
            exit 0
          fi
          git commit -m "site: publish marketing site from zoid@${GITHUB_SHA::7}"
          git push
          echo "published site to strvmarv/zoid-releases:docs/"