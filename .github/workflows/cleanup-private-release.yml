name: cleanup-private-release

# Distribution model: this PRIVATE source repo (strvmarv/zoid) holds no
# user-facing releases — everyone downloads from the PUBLIC strvmarv/zoid-releases
# repo. But cargo-dist's `host` job creates a GitHub Release *here* anyway
# (dist-workspace.toml: create-release = true, which the `host` job needs so its
# artifact upload targets an existing release), and that private release's body
# bakes in strvmarv/zoid download URLs — a misleading install page that 404s for
# anyone without private access. The mirror job (publish-public.yml) pulls from
# the workflow's uploaded ARTIFACTS, not from this release, so once the Release
# workflow finishes the private release is pure byproduct and safe to delete.
#
# This workflow deletes it (keeping the git tag, which the public release and the
# `zoid update` version history depend on). It runs with the default GITHUB_TOKEN,
# which has contents:write on THIS repo — the custom mirror job cannot do this
# itself (it runs with restricted id-token/packages permissions and a token
# scoped to the public repo).

on:
  # Fires after the whole Release workflow completes (build -> host ->
  # custom-publish-public -> announce), guaranteeing the public mirror is already
  # done before we remove the private release.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Manual trigger for backfill / verification against a specific tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose private-repo release to delete (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-private-release:
    runs-on: ubuntu-latest
    # For workflow_run: only act on a SUCCESSFUL Release run triggered by a
    # version tag (head_branch is the tag name for a tag push). For
    # workflow_dispatch: always run (the operator chose the tag explicitly).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           startsWith(github.event.workflow_run.head_branch, 'v')) }}
    steps:
      - name: Delete private-repo release (keep the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          # Tag from the manual input, else the tag that triggered the Release run.
          TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::no tag resolved"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # --yes deletes the release only; the git tag is preserved (no
            # --cleanup-tag), so the public release and update history stay intact.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "deleted private release $TAG (tag kept)"
          else
            echo "no private release $TAG to delete (already clean)"
          fi
