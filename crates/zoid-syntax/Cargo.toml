[package]
name = "zoid-syntax"
version.workspace = true
edition.workspace = true

[dependencies]
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
tree-sitter-json = "0.24"
# Pinned <0.4: tree-sitter-md 0.5.x ships a grammar built at ABI 15, which
# tree-sitter 0.24 (ABI 13-14) rejects with `LanguageError { version: 15 }`.
# 0.3.2 is generated at ABI 14 and loads cleanly.
tree-sitter-md = ">=0.3.2, <0.4"
tree-sitter-rust = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"

[dev-dependencies]
proptest = { workspace = true }
