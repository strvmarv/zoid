[package]
name = "zoid"
version = "0.0.0"
edition.workspace = true

[lib]
name = "zoid"
path = "src/lib.rs"

[[bin]]
name = "zoid"
path = "src/main.rs"

[dependencies]
zoid-core = { path = "../zoid-core" }
zoid-provider = { path = "../zoid-provider" }
zoid-tools = { path = "../zoid-tools" }
zoid-tui = { path = "../zoid-tui" }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
tui-textarea = { workspace = true }
ulid = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
# Only for the local UTC offset behind the message-row HH:MM stamps; std can't
# read the system timezone. `clock` pulls the platform tz lookup; nothing else.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
