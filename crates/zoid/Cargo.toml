[package]
name = "zoid"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "zoid"
path = "src/lib.rs"

[[bin]]
name = "zoid"
path = "src/main.rs"

[dependencies]
zoid-core = { path = "../zoid-core" }
zoid-provider = { path = "../zoid-provider" }
zoid-tools = { path = "../zoid-tools" }
zoid-tui = { path = "../zoid-tui" }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
# CancellationToken threads a cooperative stop signal into the agent turn loop
# (Esc/Ctrl-C cancellation). Pure Rust, no C deps — static-musl safe.
tokio-util = { version = "0.7", default-features = false }
tui-textarea = { workspace = true }
ulid = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
# Only for the local UTC offset behind the message-row HH:MM stamps; std can't
# read the system timezone. `clock` pulls the platform tz lookup; nothing else.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
git2 = { workspace = true }
# OSC 52 clipboard copy of code blocks (SSH-safe; no platform clipboard dep).
base64 = "0.22"
reqwest = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
rusqlite = { workspace = true }
zoid-testkit = { path = "../zoid-testkit" }
tokio-util = { version = "0.7", default-features = false }
flate2 = "1"
tar = "0.4"
