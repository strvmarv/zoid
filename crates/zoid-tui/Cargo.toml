[package]
name = "zoid-tui"
version = "0.0.0"
edition.workspace = true

[dependencies]
ratatui = { workspace = true }
serde_json = { workspace = true }
zoid-core = { path = "../zoid-core" }
zoid-provider = { path = "../zoid-provider" }
zoid-syntax = { path = "../zoid-syntax" }
tui-textarea = { workspace = true }
# Match the version ratatui 0.29 uses so our width measurement agrees with its
# own truncator — a mismatch would let a row we think fits get clipped.
unicode-width = "0.2"
# Message-body markdown → styled spans (spec §3.5). Pure-Rust, no runtime;
# default features off (drops the html/getopts extras) to respect the size budget.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
insta = { workspace = true }
