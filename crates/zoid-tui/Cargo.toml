[package]
name = "zoid-tui"
version.workspace = true
edition.workspace = true

[dependencies]
ratatui = { workspace = true }
serde_json = { workspace = true }
zoid-core = { path = "../zoid-core" }
zoid-model = { path = "../zoid-model" }
zoid-syntax = { path = "../zoid-syntax" }
ratatui-textarea = { workspace = true }
# Match the version ratatui-core uses so our width measurement agrees with its
# own truncator — a mismatch would let a row we think fits get clipped.
unicode-width = "0.2"
# Message-body markdown → styled spans (spec §3.5). Pure-Rust, no runtime;
# default features off (drops the html/getopts extras) to respect the size budget.
pulldown-cmark = { version = "0.13", default-features = false }

[features]
# Opt-in: compiles the buffer→HTML converter used only by the `web_capture`
# example + the marketing site build. Never enabled by the product binary,
# so it costs zero bytes in a default `cargo build -p zoid`.
web-capture = []

[dev-dependencies]
insta = { workspace = true }
