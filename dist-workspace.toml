[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Archive format for non-windows builds (must match the updater's asset names)
unix-archive = ".tar.gz"
# Archive format for windows builds (must match the updater's asset names)
windows-archive = ".zip"
# Don't create a Release in this private source repo; a future custom job
# publishes to the public releases repo instead.
create-release = false
# Where the shell/PowerShell installer scripts install the binary.
install-path = "CARGO_HOME"
# Custom publish job: lands the Release in the public strvmarv/zoid-releases repo.
publish-jobs = ["./publish-public"]
